name: Validate skill and itinerary auditor
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python realistic-travel-planner/scripts/audit_plan.py evaluation/audit-example.json --constraints evaluation/audit-constraints.json
      - run: python scripts/validate_package.py
